[package]
name = "changeforest"
description = "Random Forests for Change Point Detection"
authors = ["Malte Londschien <malte@londschien.ch>"]
repository = "https://github.com/mlondschien/changeforest/"
version = "2.0.0"
edition = "2021"
readme = "README.md"
license = "BSD-3-Clause"
exclude = ["/.github", "/changeforest-py", "/changeforest-r", "/testdata", ".pre-commit-config.yaml", ".gitignore"]

[lib]
name = "changeforest"

[dependencies]
ndarray = "0.17.1"
rand = "0.9"
biosphere = "0.4.2"

[dev-dependencies]
rstest = "0.26"
assert_approx_eq = "1.1"
ndarray-rand = "0.16"
ndarray = { version = "0.17.1", features = ["approx"] }
ndarray-csv = "0.5.4"
csv = "^1"

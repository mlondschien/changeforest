[package]
name = "changeforest_py"
version = "1.2.2"
edition = "2021"
readme = "README.md" 

[lib]
name = "changeforest"
crate-type = ["cdylib"]

[package.metadata.maturin]
name = "changeforest"

[dependencies]
numpy = "0.27.1"
changeforest = { path = "../" }
ndarray = "0.17.1"
pyo3 = {version = "0.27", features = ["extension-module"]}
biosphere = "0.4.2"
